ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:15px}
button.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}

.opt:hover{border-color:var(--acc)}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}

<h1>&#128269; Forensics C Trainer</h1><div id="xp" class="xp"></div>
<div class="sub">Science Olympiad 2027 &middot; Division C only &middot; study together: sign in and see how your classmates are doing.</div>
<div class="tabs" id="tabs"></div><div class="sub-tabs" id="subtabs"></div><div id="view"></div>
<p class="small">Content follows the 2027 Forensics C rules (Parts 1 to 4). Sample counts and lists change by tournament level, so check your tournament's rules and your coach's notes.</p>
</div>
<script>
const $=s=>document.querySelector(s);
const TOPICS={rules:'Event rules & scoring',qual:'Qualitative analysis of solids (3.b, 20%)',poly:'Plastics, fibers & hair (3.c, 20%)',chrom:'Chromatography & mass spectra (3.d, 15%)',print:'Fingerprints (3.e)',bio:'DNA & blood (3.e)',trace:'Glass, soil, seeds, tracks & bullets (3.e)',scene:'Spatters & insects (3.e)',case:'Analysis of the crime (3.f, 30%)'};
// ---------- LEARN CONTENT ----------
const LESSONS=[
{id:'r1',t:'rules',i:'📋',n:'The event in one minute',hook:'Two people, 50 minutes, one crime to solve.',st:['A team of up to 2 solves a mock crime from a scenario, some suspects and a series of tests.','About 50 minutes. High score wins. Time is not scored.','Each person may bring writing tools, a Class III calculator and ONE 8.5 x 11 inch sheet of paper. Both sides, any form, any source, no affixed labels. It can be in a sheet protector sealed with tape, or laminated.','The team may bring items from the Division C Chemistry Events Lab Equipment List on soinc.org. The supervisor will not provide them, so teams without them may be at a disadvantage.'],mem:'Two people, 50 minutes, one sheet each, one crime.'},
{id:'r2',t:'rules',i:'🏆',n:'How the score is split',hook:'20, 20, 15, 15, 30. The write-up is the biggest piece.',st:['3.b Qualitative analysis of solids: about 20%.','3.c Polymers (plastics, fibers, hair): about 20%.','3.d Chromatography and mass spectra: about 15%.','3.e Crime scene physical evidence: about 15%.','3.f Analysis of the crime: about 30%.','Ties are broken by the crime analysis score, including your reasons for clearing suspects.','Penalties: 10% for not cleaning up as the supervisor says. Up to 10% for bringing prohibited lab equipment.'],ex:{q:'A team earns full marks on 3.b and 3.f and nothing else. Score?',st:['3.b = 20 and 3.f = 30','20 + 30 = 50%']},mem:'20, 20, 15, 15, 30.'},
{id:'r3',t:'rules',i:'🥽',n:'Safety, dress and clean-up',hook:'Goggles on, skin covered, hair tied back.',st:['Wear goggles and an apron or lab coat the whole time.','Skin must be covered from the neck down to the wrist and toes. Pants should be loose fitting.','Gloves are optional unless the host asks for a type.','Shoulder-length or longer hair must be tied back.','Take off safety gear or handle materials unsafely: penalty, up to disqualification.','Dispose of waste the way the supervisor tells you. Not cleaning up costs 10%.'],mem:'Goggles, apron, covered skin, hair back, waste where told.'},
{id:'r4',t:'rules',i:'🧰',n:'What the supervisor gives you',hook:'Know the toolbox before test day.',st:['ALWAYS provided: iodine reagent (I₂ in KI, or 2% tincture of iodine), 1 M HCl, 1 M NaOH, Benedict’s solution, a hot water bath, a Bunsen burner (or equal heat source) for flame tests, a waste container, chromatography materials, a wash bottle of distilled water.','MAY be provided: a microscope and probes, candle and matches if fibers are given, density solutions if plastics are given, reagents for other tests.','Each tool matches a test: iodine = starch, Benedict’s + hot bath = glucose, HCl = carbonates, NaOH = ammonium and metal ions, burner = flame test and fiber burn.'],mem:'Iodine = starch. Benedict’s = sugar. HCl = fizz. Burner = flame.'},
{id:'r5',t:'rules',i:'📊',n:'How much evidence per level',hook:'Regional is light. National is a lot.',st:['Regional: 3 to 8 solids, 5 to 9 polymers, 1 chromatogram type plus mass spectra, 1 to 2 crime scene topics.','State: 6 to 10 solids, 6 to 12 polymers, 1 to 2 chromatogram types plus mass spectra, 1 to 3 crime scene topics.','National: 10 to 14 solids, 10 to 18 polymers, 1 to 3 types plus mass spectra, 3 to 5 crime scene topics.','The crime analysis is required at every level.','Questions only come from the evidence topics used in that competition. The evidence can appear in a mock crime scene.','All teams get the same set of solids, and there are no mixtures of solids.'],mem:'Bigger tournament, more samples, more topics.'},

{id:'q1',t:'qual',i:'🧂',n:'The 15 solids',hook:'Learn them in families.',st:['SODIUM: sodium acetate, sodium chloride, sodium hydrogen carbonate (baking soda), sodium carbonate.','OTHER SALTS: lithium chloride, potassium chloride, ammonium chloride, magnesium sulfate.','CALCIUM: calcium nitrate, calcium sulfate, calcium carbonate.','FOOD AND ORGANIC: cornstarch, glucose, sucrose.','ACID: boric acid.','Formulas: CH₃COONa, NaCl, NaHCO₃, Na₂CO₃, LiCl, KCl, NH₄Cl, MgSO₄, Ca(NO₃)₂, CaSO₄, CaCO₃, C₆H₁₂O₆ (glucose), C₁₂H₂₂O₁₁ (sucrose), H₃BO₃.'],mem:'Sodium x4, other salts x4, calcium x3, food x3, boric acid.'},
{id:'q2',t:'qual',i:'🔥',n:'Flame tests',hook:'Metal ions give flames their colors.',st:['Dip a clean loop or splint in the solid (or its solution) and hold it in the burner flame.','SODIUM: bright yellow-orange. It is so strong it can hide other colors.','LITHIUM: crimson red.','POTASSIUM: lilac (pale violet). It is easy to miss.','CALCIUM: orange-red or brick red.','BORIC ACID: green flame (or green edges).','Magnesium, ammonium, glucose and sucrose give no useful metal color (sugars and starch just char).'],mem:'Li = red, Na = yellow, K = lilac, Ca = brick, boron = green.'},
{id:'q3',t:'qual',i:'🫧',n:'Acid and base tests',hook:'Fizz means carbonate.',st:['Add 1 M HCl. FIZZ (carbon dioxide gas) means a carbonate or hydrogen carbonate: sodium hydrogen carbonate, sodium carbonate, calcium carbonate.','Sodium acetate plus acid makes acetic acid: a vinegar smell.','Add 1 M NaOH and warm gently. AMMONIA smell (and damp red litmus turning blue) means ammonium chloride.','Magnesium sulfate plus NaOH makes a white cloudy precipitate (magnesium hydroxide).','Calcium salts plus NaOH can also look cloudy white, so use other clues too.'],mem:'HCl fizz = carbonate. NaOH smell = ammonium.'},
{id:'q4',t:'qual',i:'🧪',n:'Starch and sugar tests',hook:'Iodine for starch. Benedict’s for glucose.',st:['IODINE: turns blue-black with starch (cornstarch). Brown or orange with no change means no starch.','BENEDICT’S SOLUTION plus a hot water bath: glucose is a reducing sugar, so the blue turns green, then orange or brick red.','SUCROSE is not a reducing sugar. Benedict’s stays blue (it only reacts after the sucrose is broken down with acid).','Cornstarch does not really dissolve in cold water. Glucose and sucrose both dissolve.'],mem:'Iodine = starch. Benedict’s = glucose, not sucrose.'},
{id:'q5',t:'qual',i:'💧',n:'Solubility and pH',hook:'Add water first. It tells you a lot.',st:['INSOLUBLE or barely: calcium carbonate, calcium sulfate (slightly), cornstarch (cloudy).','SOLUBLE: the rest.','Test the solution pH with indicator paper. Sodium carbonate is strongly basic (about 11). Sodium hydrogen carbonate and sodium acetate are mildly basic (about 8 to 9).','Boric acid and ammonium chloride are mildly acidic (about 5 or 6).','Sodium chloride, potassium chloride, lithium chloride, calcium nitrate, glucose and sucrose are about neutral (7).'],mem:'Carbonate = strong base. Boric and ammonium = weak acid.'},
{id:'q6',t:'qual',i:'🗺️',n:'Identify an unknown: the plan',hook:'Look, dissolve, flame, acid, special test.',st:['1. Look: white crystals or powder? Note texture.','2. Add water: does it dissolve? Insoluble white: calcium carbonate (fizzes), calcium sulfate, cornstarch (iodine blue-black).','3. Flame test: Li red, Na yellow, K lilac, Ca brick red, boron green.','4. HCl: fizz = carbonate (sodium carbonate vs sodium hydrogen carbonate: check the pH, carbonate is stronger).','5. NaOH smell = ammonium chloride. White cloud and no flame = magnesium sulfate.','6. Benedict’s: orange = glucose. Sucrose = no change. Iodine: blue-black = starch.','7. Yellow flame, no fizz, mild base, vinegar smell with HCl = sodium acetate. Yellow flame and neutral = sodium chloride.'],mem:'Water, flame, acid, then the special test.'},

{id:'p1',t:'poly',i:'♻️',n:'The plastics',hook:'Number, name, density.',st:['PETE (#1) soda bottles. HDPE (#2) milk jugs. PVC (#3) pipes. LDPE (#4) bags. PP (#5) yogurt tubs. PS (#6) foam cups and clear cases (non-expanded for this event). PMMA acrylic. PC polycarbonate.','Densities (g/cm³): PP 0.90, LDPE 0.92, HDPE 0.95, PS 1.05, PMMA 1.18, PC 1.20, PVC 1.3 to 1.4, PETE 1.38.','In plain water (1.00) only PP, LDPE and HDPE float. All the others sink.','PETE and PVC are the densest.'],mem:'Water floaters: PP, LDPE, HDPE.'},
{id:'p2',t:'poly',i:'🥣',n:'Density tests for plastics',hook:'Sink or float in a ladder of liquids.',st:['Put the piece in a liquid. If its density is LESS than the liquid it floats. If MORE it sinks.','Water 1.00: separates PP, LDPE and HDPE (float) from the rest (sink).','A salt solution a little denser than PS (about 1.10) floats PS but sinks PMMA, PC, PETE and PVC.','Go up a ladder of denser solutions and note where each piece first floats.','Density = mass ÷ volume. Make sure bubbles are off the sample.'],ex:{q:'A piece has mass 10.5 g and volume 10 cm³. Which plastic is it closest to?',st:['Density = 10.5 ÷ 10 = 1.05 g/cm³','That is polystyrene (PS)']},mem:'Lighter than the liquid floats.'},
{id:'p3',t:'poly',i:'🕯️',n:'Plastic burn results (given to you)',hook:'You do not burn plastics, but you may read the results.',st:['Participants do NOT perform burn tests on the plastics. The supervisor may give burn results.','PE and PP: burn with a drip, candle-wax smell, keep burning.','PS: smoky black soot, sweet styrene smell.','PVC: hard to keep burning, green-edged flame, sharp acrid smell (HCl). It stops burning when removed.','PMMA: burns steadily, fruity sweet smell, can crackle.','PC: yellow sooty flame, tends to go out on its own.','PETE: sooty, sweet smell, melts and drips.'],mem:'PE/PP = candle. PS = soot. PVC = green and acrid.'},
{id:'p4',t:'poly',i:'🧵',n:'Fibers: natural vs synthetic',hook:'Plant, animal, or made in a factory.',st:['PLANT (cellulose): cotton, linen.','ANIMAL (protein): wool, silk.','SYNTHETIC: nylon, polyester, spandex.','Burn test (permitted on fibers): cotton and linen burn fast, smell like burning paper, leave soft gray ash.','Wool and silk smell like burning hair or feathers and leave a crushable black ash. Wool tends to go out by itself.','Nylon melts, drips and smells like celery or chemicals. It leaves a hard bead.','Polyester melts and burns with black smoke and a sweet smell, leaving a hard black bead.','Spandex melts and burns, and stretches a lot before it is burned.'],mem:'Paper smell = plant. Hair smell = animal. Melts into a bead = synthetic.'},
{id:'p5',t:'poly',i:'🔬',n:'Fibers under the microscope',hook:'Look at the shape of each fiber.',st:['COTTON: flat, twisted ribbon (like a flattened twisted tube).','LINEN: straight, with small bumps (nodes) like bamboo.','WOOL: scales on the surface, like shingles.','SILK: very smooth and straight, fine and shiny.','NYLON and POLYESTER: smooth, uniform rods, sometimes with dull specks (delusterant).','Synthetics are very even in width. Natural fibers vary.'],mem:'Cotton twists, linen has nodes, wool has scales, silk is smooth.'},
{id:'p6',t:'poly',i:'💇',n:'Hair structure',hook:'Cuticle outside, cortex middle, medulla center.',st:['CUTICLE: outer layer of overlapping scales, like roof shingles.','CORTEX: the bulk of the hair. It holds the pigment granules.','MEDULLA: the center canal. It can be absent, broken up, or continuous.','ROOT: the bulb at the base. A growing hair has a sticky follicular tag, which carries nuclear DNA. A resting hair has a club-shaped root with no tag.','Hair shaft only (no root) gives mitochondrial DNA, not nuclear DNA.'],mem:'Cuticle, cortex, medulla. Tag on the root = nuclear DNA.'},
{id:'p7',t:'poly',i:'🐿️',n:'Hair scales and species',hook:'Human or animal? Medulla size and scale shape.',st:['SCALE TYPES: coronal (crown-like, stacked cups), spinous (petal or triangle shaped), imbricate (flat, overlapping, like shingles).','HUMAN: imbricate scales, thin or absent medulla, pigment spread fairly evenly.','MEDULLARY INDEX = medulla width ÷ hair width. Human is less than 1/3. Animal hair is usually more than 1/2.','BAT: very fine, strongly patterned scales (coronal or petal-like).','SQUIRREL: wide medulla with a ladder or lattice look.','COW and HORSE: coarse, thick shafts. Horse is especially thick with a wide medulla.','Check the photos in your own notes. These are cues, not guarantees.'],ex:{q:'Medulla 12 µm wide in a hair 60 µm wide. Human-like?',st:['MI = 12 ÷ 60 = 0.20','Less than 1/3, so human-like']},mem:'Human: index under 1/3. Animal: over 1/2.'},

{id:'c1',t:'chrom',i:'📄',n:'Paper chromatography',hook:'The solvent climbs and carries the colors up.',st:['The paper is the STATIONARY phase. The solvent is the MOBILE phase.','Draw the start line with PENCIL. Pencil graphite does not dissolve. Ink would run.','The start line must sit above the solvent level, or the spots wash away.','Parts that stick to the paper stay low. Parts that like the solvent travel high.','Stop when the solvent front is near the top and mark it right away. It dries and disappears.'],mem:'Pencil line, solvent below it, mark the front.'},
{id:'c2',t:'chrom',i:'📏',n:'Rf values',hook:'Spot distance over solvent distance.',st:['Rf = distance the spot moved ÷ distance the solvent front moved.','Measure both from the start line. Measure to the CENTER of the spot.','Rf is always between 0 and 1. It has no units.','Same substance and same conditions give the same Rf, so you can compare an unknown to knowns.'],ex:{q:'Spot moved 3.2 cm. Solvent front moved 8.0 cm. Rf?',st:['Rf = 3.2 ÷ 8.0','Rf = 0.40']},mem:'Rf = spot ÷ solvent.'},
{id:'c3',t:'chrom',i:'🧫',n:'TLC (thin layer)',hook:'Same idea, on a silica plate.',st:['TLC uses a thin silica gel layer on a plate as the stationary phase. Silica is polar.','On a polar plate, polar parts stick and move less. Less polar parts move farther (higher Rf).','Spot small and let the spot dry.','Many spots are colorless. A UV lamp or stain makes them show.','Mark the solvent front right away. Calculate Rf the same way.'],mem:'Silica plate: polar sticks, nonpolar runs.'},
{id:'c4',t:'chrom',i:'🖍️',n:'Matching a chromatogram to a suspect',hook:'Same pattern, same source.',st:['A mixture such as an ink or dye splits into several spots.','Compare the evidence strip to each suspect strip: same number of spots, same colors, same heights (Rf).','If one suspect matches every spot, that suspect is consistent with the evidence.','A strip with different spots or missing spots is eliminated.','Say the numbers: "spots at Rf 0.35 and 0.72 match suspect B".'],mem:'Count the spots, compare the heights.'},
{id:'c5',t:'chrom',i:'📈',n:'Reading a mass spectrum',hook:'The right-most big peak is the whole molecule.',st:['A mass spectrometer breaks a molecule into charged pieces and sorts them by mass-to-charge (m/z).','x-axis = m/z. y-axis = relative abundance (the tallest peak is the BASE PEAK = 100%).','MOLECULAR ION (M⁺): the peak at the highest m/z. It equals the molecular mass.','Gaps between peaks show lost pieces: 15 = CH₃, 18 = water, 28 = CO or ethene, 29 = ethyl or CHO, 43 = propyl or acetyl.','Common fragments: 77 = phenyl ring (benzene), 91 = benzyl.','Chlorine shows two peaks (M and M+2) in about a 3 to 1 ratio. Bromine is about 1 to 1.'],mem:'Right-most = the molecule. Tallest = base peak.'},

{id:'f1',t:'print',i:'🖐️',n:'Skin layers and why prints exist',hook:'Ridges are built in the deep layer and last for life.',st:['Skin has the EPIDERMIS (outer), DERMIS (middle, with nerves and blood vessels) and the hypodermis (fat) below.','Friction ridges form in the womb and are set in the dermis, so a new epidermis grows back with the same pattern.','Each person’s prints are unique, even identical twins.','Sweat (water, salts, amino acids) and oils from touching the face leave a print on a surface.','Print types: PATENT (visible, like in blood or ink), LATENT (hidden), PLASTIC (a 3-D impression, like in wax or soap).'],mem:'Epidermis outside, dermis sets the pattern.'},
{id:'f2',t:'print',i:'🌀',n:'The 8 patterns',hook:'Arches, loops, whorls.',st:['ARCHES (about 5%): plain arch and tented arch (a sharp upward spike or angle).','LOOPS (about 60 to 65%): radial loop (opens toward the thumb side, the radius bone) and ulnar loop (opens toward the little-finger side, the ulna bone). One delta.','WHORLS (about 30 to 35%): plain whorl, central pocket whorl, accidental whorl, double loop whorl. Two deltas.','Arches have no delta. Loops have one. Whorls have two (or more).','Double loop whorl = two loops twisting around each other. Accidental = a mix of two different patterns or one that does not fit.'],mem:'Arch 0 deltas, loop 1, whorl 2. Ulnar = pinky side.'},
{id:'f3',t:'print',i:'🔎',n:'Ridge details (minutiae)',hook:'The tiny features that make a match.',st:['RIDGE ENDING: a ridge just stops.','BIFURCATION: a ridge splits into two. DOUBLE BIFURCATION: two splits close together. TRIFURCATION: a ridge splits into three.','ISLAND: a very short ridge, like a dot.','ENCLOSURE: a ridge splits and rejoins, making a small loop shape (also called a lake or eye).','SPUR: a short branch sticking off a ridge.','LOOP: ridges enter on one side, turn and leave on the same side.','DELTA: a triangle where ridges meet from three directions.'],mem:'Split = bifurcation. Dot = island. Split and join = enclosure.'},
{id:'f4',t:'print',i:'🧴',n:'Developing prints',hook:'Match the method to the surface.',st:['DUSTING: powder sticks to the oils and moisture. Use dark powder on light surfaces and light powder on dark surfaces.','IODINE FUMING: iodine vapor dissolves into the oils and makes brown prints. They fade quickly. Good on paper and wood.','NINHYDRIN: reacts with AMINO ACIDS in the print and turns purple (Ruhemann’s purple). Used on porous paper. Heat and humidity speed it up.','CYANOACRYLATE (super glue) FUMING: the vapor sticks to the print’s moisture and builds a hard white polymer. Used on non-porous surfaces like plastic, metal and glass.','Plastic prints (3-D, in soft materials) are photographed, not developed.'],mem:'Paper: ninhydrin. Plastic or metal: super glue. Quick and brown: iodine.'},

{id:'d1',t:'bio',i:'🧬',n:'DNA basics',hook:'Four letters, in pairs.',st:['DNA is a double helix: two strands twisted together.','The bases pair A with T and C with G.','Forensics looks at STRs (short tandem repeats): short DNA sequences that repeat. People differ in how many repeats they have.','You get one copy of each STR from each parent, so each person has two alleles at every spot (locus).','A match means every locus matches. One mismatch excludes the suspect.'],mem:'A–T, C–G. Repeat count differs between people.'},
{id:'d2',t:'bio',i:'🔁',n:'PCR: how DNA is copied',hook:'Heat, cool, build. Repeat.',st:['PCR (polymerase chain reaction) copies a small bit of DNA millions of times.','Ingredients: template DNA, two primers, Taq polymerase (a heat-proof enzyme), the four nucleotides, buffer.','Step 1 DENATURE (about 95 °C): heat separates the two strands.','Step 2 ANNEAL (about 50 to 60 °C): cool so the primers stick to the strands.','Step 3 EXTEND (about 72 °C): Taq builds the new strands.','Each cycle doubles the DNA. 30 cycles gives about a billion times more.'],ex:{q:'Starting with 1 copy, how many copies after 10 cycles?',st:['Each cycle doubles','2¹⁰ = 1024 copies']},mem:'Heat apart, cool to bind, build up. Doubles every cycle.'},
{id:'d3',t:'bio',i:'📉',n:'Electropherograms and gels',hook:'Matching peaks (or bands) means a match.',st:['DNA is negative, so in electrophoresis it moves toward the + electrode. Small pieces move faster and farther.','On a GEL the fragments make bands. A ladder of known sizes shows how big they are.','An ELECTROPHEROGRAM is a graph: x-axis = fragment size, y-axis = signal (RFU). Each peak is one allele.','Two different peaks at a locus = heterozygous. One tall peak = homozygous.','Compare scene DNA to each suspect at every locus. Matching at all loci = a match. Any clear mismatch = excluded.','More than two peaks at a locus can mean a mixture of people.'],mem:'Small moves farther. Every peak must match.'},
{id:'d4',t:'bio',i:'🩸',n:'Blood typing: ABO',hook:'Clumping shows the antigen.',st:['Red cells can carry A and/or B antigens (markers).','Type A: A antigen. Type B: B antigen. Type AB: both. Type O: neither.','You can test with anti-A and anti-B serum. If a serum makes the blood CLUMP (agglutinate), that antigen is present.','Clumps with anti-A only = type A. Anti-B only = type B. Both = AB. Neither = O.','Rh factor: clumping with anti-D = Rh positive.','Blood type is class evidence: it narrows the group but does not name one person.'],mem:'Clumps with the serum = that antigen is there.'},
{id:'d5',t:'bio',i:'🔬',n:'Whose blood? Microscope slides',hook:'Nucleus or no nucleus. Round or oval.',st:['MAMMAL red cells: no nucleus, round, flattened discs.','BIRD red cells: oval, WITH a nucleus, fairly small.','REPTILE and AMPHIBIAN red cells: oval, WITH a nucleus, and larger (amphibians are the biggest).','Human red cells are about 7 to 8 µm across. Many other mammals are smaller or larger.','Telling human from other mammal needs size or a special test.'],mem:'No nucleus = mammal. Nucleus = bird, reptile, amphibian.'},

{id:'t1',t:'trace',i:'🪟',n:'Glass and refractive index',hook:'When the edge disappears, the glass matches the liquid.',st:['Refractive index (n) = speed of light in vacuum ÷ speed of light in the material. Glass is a little over 1.4 to 1.6.','Each type of glass has its own index. Float (window) glass is about 1.52.','Immersion method: put a chip in oil. When the oil’s index equals the glass’s index, the chip’s edge seems to vanish (the Becke line).','Heat the oil to change its index until the chip disappears. Read the temperature and match it to the glass.','Density is also used to compare glass.'],ex:{q:'Light moves at 2.0 × 10⁸ m/s in glass. n? (c = 3.0 × 10⁸)',st:['n = c ÷ v','n = 3.0 ÷ 2.0 = 1.5']},mem:'Edge vanishes = same index.'},
{id:'t2',t:'trace',i:'💥',n:'Glass fractures: which came first',hook:'A crack stops at an earlier crack.',st:['RADIAL cracks run outward from the hole like spokes. CONCENTRIC cracks form rings around it.','Radial cracks form first and concentric cracks later.','When two fractures meet in a T, the crack that STOPS at the other one is the LATER one.','3R rule: Radial cracks make a Right angle on the Reverse side from where the force came.','A bullet makes a cone-shaped crater wider on the EXIT side, so the wide side shows which way it went.'],mem:'The crack that ends is the later one.'},
{id:'t3',t:'trace',i:'🥾',n:'Tracks and soil',hook:'Class evidence and individual marks.',st:['FOOTPRINTS: size, tread pattern, wear spots and cuts. Shoe model = class evidence. A unique cut or wear pattern = individual evidence.','Stride length is longer when running. A person’s height is about foot length ÷ 0.15 (foot is about 15% of height).','TIRE TRACKS: tread pattern, width and the track width (distance between left and right tires) and wheelbase (front to back).','SOIL: color, texture (sand, silt, clay), pH, mineral grains, organic matter. Compare scene soil to shoe soil.','Layered soil can be sorted by density in a liquid column.'],mem:'Match the pattern, the size and the wear.'},
{id:'t4',t:'trace',i:'🌼',n:'Seeds and pollen',hook:'Plants say where you have been.',st:['POLLEN grains have shapes that are unique to each plant: smooth, spiny, with pores or furrows.','Wind-pollinated plants (grass, pine) make light, smooth, smaller grains. Insect-pollinated plants make sticky, spiny, larger grains.','Pine pollen has two air sacs.','SEEDS: hooked burrs stick to clothes. Wings (maple), fluff (dandelion), floaters (coconut) travel by wind or water.','Compare seeds and pollen at the scene with those on a suspect or from a region to place them there.'],mem:'Shape tells the plant. Plant tells the place.'},
{id:'t5',t:'trace',i:'🔫',n:'Bullet striations',hook:'Every barrel scratches its own signature.',st:['RIFLING: spiral grooves in a barrel make the bullet spin. The raised parts are LANDS, the cut parts are GROOVES.','Class features: caliber, number of lands and grooves, and twist direction (left or right).','INDIVIDUAL features: tiny scratches (STRIATIONS) from imperfections in that barrel.','A comparison microscope puts two bullets side by side to line up striations.','Cartridge casings also match: firing pin mark, breech face marks, ejector and extractor marks.'],mem:'Lands and grooves are class. Scratches are individual.'},

{id:'e1',t:'scene',i:'🩸',n:'Spatter angle of impact',hook:'Round means straight on. Long means shallow.',st:['A drop hitting straight on (90°) makes a round stain. A drop hitting at a shallow angle makes a long, oval stain.','Measure the stain’s WIDTH and LENGTH.','sin θ = width ÷ length. Then use the arcsin (sin⁻¹) button.','The pointed tail and any small satellite drops lead in the direction the drop was traveling.'],ex:{q:'Stain width 5 mm, length 10 mm. Angle?',st:['sin θ = 5 ÷ 10 = 0.5','θ = sin⁻¹(0.5) = 30°']},mem:'sin θ = width ÷ length.'},
{id:'e2',t:'scene',i:'📍',n:'Area of convergence and height',hook:'Draw lines back to where the blood came from.',st:['Draw a straight line along the long axis of each stain, back toward where the drop came from (away from the tail).','The lines cross at the AREA OF CONVERGENCE (the spot on the surface, in 2-D).','Measure the distance from a stain to that point.','HEIGHT OF ORIGIN: height = distance × tan θ.','Height is the area of origin above the surface (3-D).'],ex:{q:'A stain is 40 cm from the point of convergence and its angle is 30°. Height?',st:['tan 30° = 0.577','40 × 0.577 = 23 cm']},mem:'Lines cross at convergence. Height = distance × tan θ.'},
{id:'e3',t:'scene',i:'💧',n:'Spatter velocity and types',hook:'Bigger drops mean slower speed.',st:['LOW velocity: drops larger than about 4 mm (drips, pools, walking).','MEDIUM velocity: about 1 to 4 mm (beating, stabbing, cast-off).','HIGH velocity: tiny mist drops under about 1 mm (gunshot, explosions, power tools).','PASSIVE: drips and pools from gravity. PROJECTED: an arterial spurt or swing (cast-off). TRANSFER: a wipe or swipe where an object touched blood.','The tail shows the direction, not the speed.'],mem:'Big drops = slow. Mist = fast.'},
{id:'e4',t:'scene',i:'🪰',n:'Insects and time since death',hook:'The oldest bug gives the minimum time.',st:['Blow flies arrive within minutes to hours and lay eggs on the body.','Life cycle: egg, larva (maggot, three growth stages), pupa, adult.','Warmer weather speeds growth. Cold slows it.','Find the oldest stage on the body. That stage plus the temperature gives the MINIMUM time since death.','Body stages: fresh, bloat, active decay, advanced decay, dry. Different insects arrive at different stages (flies first, beetles later).'],mem:'Oldest stage + temperature = minimum time.'},

{id:'a1',t:'case',i:'🧩',n:'Class vs individual evidence',hook:'Narrows the group or names the one.',st:['CLASS evidence matches a group: blood type, fiber type, shoe size, plastic type, glass type, soil type.','INDIVIDUAL evidence points to one source: DNA, fingerprints, bullet striations, a tool mark, a unique shoe cut.','Locard’s principle: every contact leaves a trace both ways.','A match says the suspect COULD be the source. A mismatch usually EXCLUDES.','Chain of custody: record everyone who held the evidence.'],mem:'Class narrows. Individual names.'},
{id:'a2',t:'case',i:'✍️',n:'Writing the crime analysis',hook:'Culprit, evidence, and why the others are out.',st:['1. NAME the culprit(s) in the first sentence.','2. For each piece of evidence: say what the test showed, then which suspect it points to.','3. For EACH other suspect: say the exact evidence that clears them (for example "blood type O, scene blood A").','4. Mention evidence that does not help or only places someone at the scene, and say why it is weaker.','5. Use numbers (Rf values, angles, type names). Be specific.','This part is 30% of the score and breaks ties. Reasons for clearing suspects count.'],mem:'Name, prove, then clear the others.'},
{id:'a3',t:'case',i:'⚖️',n:'Strong and weak conclusions',hook:'Do not say more than the evidence says.',st:['Strongest: DNA, fingerprints, bullet striations.','Medium: tool marks, shoe wear, a rare fiber or soil type.','Weakest (class): blood type, common fiber, shoe size, plastic type.','Several class matches that all point to the same person are stronger together.','If two suspects both fit, look for evidence that separates them.'],mem:'Many class clues on one person add up.'}
];
const LES=Object.fromEntries(LESSONS.map(l=>[l.id,l]));

// ---------- STATE ----------
let tab='C',sub={C:'path',P:'x',T:'start'},quiz=null;
function store(){try{return JSON.parse(localStorage.getItem('foren_stats')||'{}')}catch(e){return {}}}
function save(o){try{localStorage.setItem('foren_stats',JSON.stringify(o))}catch(e){}}
function logs(){try{return JSON.parse(localStorage.getItem('foren_log')||'[]')}catch(e){return []}}
function saveLogs(l){try{localStorage.setItem('foren_log',JSON.stringify(l))}catch(e){}}
const RANKS=[[0,'Rookie Sleuth'],[100,'Print Lifter'],[300,'Lab Tech'],[600,'Case Cracker'],[1000,'Master Detective']];
function showXP(){const e=$('#xp');if(!e)return;const x=store().xp||0;let r=0;RANKS.forEach((a,i)=>{if(x>=a[0])r=i});const nx=RANKS[r+1];const pct=nx?Math.round(100*(x-RANKS[r][0])/(nx[0]-RANKS[r][0])):100;e.innerHTML='<b>'+RANKS[r][1]+'</b> &middot; '+x+' XP'+(nx?' &middot; '+(nx[0]-x)+' to '+nx[1]:' &middot; max rank!')+'<div class="xpbar"><i style="width:'+pct+'%"></i></div>';}
function nav(){if(tab==='T'&&!teachOk()){tab='C'}if(tab==='P'&&!cfgOk()){tab='C'}showXP();
 $('#tabs').innerHTML=[['C','Forensics C'],['P','Class progress'],['T','Teach (coach)']].filter(x=>x[0]==='C'||(x[0]==='T'&&teachOk())||(x[0]==='P'&&cfgOk())).map(([k,n])=>`<button class="tab ${k} ${tab===k?'on':''}" onclick="tab='${k}';quiz=null;clearInterval(window.GT);G=null;render()">${n}</button>`).join('');
 const subs=tab==='P'?[]:tab==='T'?[['start','Start here (coach)'],['C','Teach: 9 sessions'],['S','Songs & my checklist'],['F','Feel it + drill']].concat(ROLE==='coach'?[['students','Students (progress)'],['addstu','Add a student']]:[]):[['path','Start here'],['vids','Videos'],['learn','Learn'],['games','Games'],['quiz','Quiz'],['tools','Calculators'],['feel','Picture drill'],['formula','Key fact a day'],['demos','Hands-on'],['exps','Lab activities'],['songs','Songs'],['dev','Rules & cases']];
 $('#subtabs').innerHTML=subs.map(([k,n])=>`<button class="st ${sub[tab]===k?'on':''}" onclick="sub[tab]='${k}';quiz=null;render()">${n}</button>`).join('');
}
function render(){if(sub[tab]!=='games'&&G){clearInterval(window.GT);G=null}nav();const v=$('#view');
 if(tab==='P'){v.innerHTML=classView();renderClass();return}
 if(tab==='T')v.innerHTML=teach(sub.T);else if(sub[tab]==='path')v.innerHTML=tasksCard()+path(tab);else if(sub[tab]==='vids')v.innerHTML=vids(tab);else if(sub[tab]==='games')v.innerHTML=games(tab);else if(sub[tab]==='learn')v.innerHTML=learn(tab);else if(sub[tab]==='quiz')quizView(tab);else if(sub[tab]==='tools')v.innerHTML=tools(tab);else if(sub[tab]==='songs')v.innerHTML=songsStudent(tab);else if(sub[tab]==='feel')v.innerHTML=feel(false,tab);else if(sub[tab]==='formula')v.innerHTML=formulaView();else if(sub[tab]==='demos')v.innerHTML=demosView();else if(sub[tab]==='exps')v.innerHTML=expView(tab);else v.innerHTML=device();

function mkGap(d){const f=sh(fsel(d))[0];const idx=f.p.map((x,i)=>OPS.includes(x)?-1:i).filter(i=>i>=0);const b=idx[Math.floor(Math.random()*idx.length)];const ans=f.p[b];

function tools(d){
 return `<div class="tip">Fill the boxes, press nothing: results and steps appear as you type. Use these to check your own answers.</div>
 <div class="card"><h3>Rf value</h3><div class="row"><input type="number" id="rf_s" placeholder="spot moved (cm)" step="any"><input type="number" id="rf_f" placeholder="solvent front moved (cm)" step="any"></div><div id="rf_o" class="res">&hellip;</div></div>
 <div class="card"><h3>Blood spatter: angle and height</h3><div class="row"><input type="number" id="sp_w" placeholder="stain width (mm)" step="any"><input type="number" id="sp_l" placeholder="stain length (mm)" step="any"><input type="number" id="sp_d" placeholder="distance to convergence (cm, optional)" step="any"></div><div id="sp_o" class="res">&hellip;</div></div>
 <div class="card"><h3>PCR copies</h3><div class="row"><input type="number" id="pc_n" placeholder="cycles" step="1"><input type="number" id="pc_s" placeholder="starting copies" value="1" step="any"></div><div id="pc_o" class="res">&hellip;</div></div>
 <div class="card"><h3>Refractive index of glass</h3><div class="row"><input type="number" id="rn_v" placeholder="speed in glass (x 10^8 m/s)" step="any"></div><div id="rn_o" class="res">&hellip;</div></div>
 <div class="card"><h3>Density and floating</h3><div class="row"><input type="number" id="de_m" placeholder="mass (g)" step="any"><input type="number" id="de_v" placeholder="volume (cm³)" step="any"></div><div id="de_o" class="res">&hellip;</div></div>
 <div class="card"><h3>Hair medullary index</h3><div class="row"><input type="number" id="hm_m" placeholder="medulla width (µm)" step="any"><input type="number" id="hm_w" placeholder="hair width (µm)" step="any"></div><div id="hm_o" class="res">&hellip;</div></div>
 <div class="card"><h3>Height from foot length</h3><div class="row"><input type="number" id="ft_l" placeholder="footprint length (cm)" step="any"></div><div id="ft_o" class="res">&hellip;</div></div>
 <div class="card"><h3>Score estimator</h3><div class="small">Enter the percent you got right on each part.</div><div class="row"><input type="number" id="sc_b" placeholder="3.b solids %"><input type="number" id="sc_c" placeholder="3.c polymers %"><input type="number" id="sc_d" placeholder="3.d chromatography %"><input type="number" id="sc_e" placeholder="3.e scene %"><input type="number" id="sc_f" placeholder="3.f analysis %"><select id="sc_p"><option value="0">No penalty</option><option value="10">10% penalty</option><option value="20">20% (both penalties)</option></select></div><div id="sc_o" class="res">&hellip;</div></div>`;}
function calcInit(){const g=id=>{const e=document.getElementById(id);return e?parseFloat(e.value):NaN};const o=(id,t)=>{const e=document.getElementById(id);if(e)e.innerHTML=t};
 const f=(x,d=2)=>Number(x.toFixed(d));
 const PL=[['PP',0.90],['LDPE',0.92],['HDPE',0.95],['PS',1.05],['PMMA',1.18],['PC',1.20],['PVC',1.35],['PETE',1.38]];
 const run=()=>{['rf_o','sp_o','pc_o','rn_o','de_o','hm_o','ft_o','sc_o'].forEach(i=>o(i,'&hellip;'));
  const s=g('rf_s'),fr=g('rf_f');if(!isNaN(s)&&fr>0)o('rf_o',s>fr?'The spot cannot travel farther than the solvent. Check your numbers.':`Rf = ${s} &divide; ${fr} = <b>${f(s/fr,3)}</b>`);
  const w=g('sp_w'),l=g('sp_l'),dd=g('sp_d');if(w>0&&l>0){if(w>l)o('sp_o','Width cannot be more than length. Swap them.');else{const th=Math.asin(w/l)*180/Math.PI;let t=`sin &theta; = ${w} &divide; ${l} = ${f(w/l,3)}. Angle = <b>${f(th,1)}&deg;</b>`;if(dd>0)t+=`<br>Height of origin = ${dd} &times; tan(${f(th,1)}&deg;) = <b>${f(dd*Math.tan(th*Math.PI/180),1)} cm</b>`;o('sp_o',t)}}
  const n=g('pc_n'),s0=g('pc_s');if(n>=0&&n<=60&&s0>0){const c=s0*Math.pow(2,n);o('pc_o',`${s0} &times; 2<sup>${n}</sup> = <b>${c>=1e6?c.toExponential(2):f(c,0)}</b> copies`)}
  const v=g('rn_v');if(v>0){const nn=2.998/v;o('rn_o',`n = c &divide; v = 2.998 &divide; ${v} = <b>${f(nn,3)}</b>`+(nn<1?' (an index below 1 is impossible: check the speed)':''))}
  const m=g('de_m'),vo=g('de_v');if(m>0&&vo>0){const D=m/vo;let near=PL.slice().sort((a,b)=>Math.abs(a[1]-D)-Math.abs(b[1]-D))[0];o('de_o',`Density = ${m} &divide; ${vo} = <b>${f(D,3)} g/cm&sup3;</b>. In water it ${D<1?'<b>floats</b>':'<b>sinks</b>'}. Closest plastic: ${near[0]} (about ${near[1]}).`)}
  const mm=g('hm_m'),hw=g('hm_w');if(mm>=0&&hw>0){const mi=mm/hw;o('hm_o',`Medullary index = ${mm} &divide; ${hw} = <b>${f(mi,2)}</b>. ${mi<1/3?'Under 1/3: human-like.':mi>0.5?'Over 1/2: animal-like.':'In between: look at the scales and pigment too.'}`)}
  const fl=g('ft_l');if(fl>0)o('ft_o',`Height &approx; ${fl} &divide; 0.15 = <b>${f(fl/0.15,0)} cm</b> (${f(fl/0.15/2.54,0)} inches)`);
  const a=['sc_b','sc_c','sc_d','sc_e','sc_f'].map(g);if(a.some(x=>!isNaN(x))){const wt=[0.2,0.2,0.15,0.15,0.3];let t=0;a.forEach((x,i)=>{t+=(isNaN(x)?0:x)*wt[i]});const p=g('sc_p')||0;o('sc_o',`Raw total = ${f(t,1)}%. After penalty = <b>${f(t*(1-p/100),1)}%</b> <span class="small">(weights 20, 20, 15, 15, 30; the 3.f part is the biggest)</span>`)}
 };
 document.querySelectorAll('#view input,#view select').forEach(e=>{e.oninput=run;e.onchange=run});}

function secs(lyr){return lyr.split(/\n\n(?=\[)/).map(b=>{const l=b.split('\n');return {tag:l[0],txt:l.slice(1).join('\n')}});}

function songLines(id){const s=SONGS.find(x=>x.id===id),out=[];secs(s.lyr).forEach((x,i)=>{x.txt.split('\n').forEach((ln,j)=>out.push({sec:i,first:j===0,tag:x.tag,ln,note:NOTES[ln]||''}))});return out;}
(function(){try{if(localStorage.getItem('foren_lsync'))return;const old=JSON.parse(localStorage.getItem('foren_sync')||'{}');const n={};SONGS.forEach(s=>{const o=old[s.id];if(!o)return;const L=songLines(s.id);n[s.id]=L.map(l=>l.first&&typeof o[l.sec]==='number'?o[l.sec]:null)});localStorage.setItem('foren_lsync',JSON.stringify(n))}catch(e){}})();
function syncGet(){try{return JSON.parse(localStorage.getItem('foren_lsync')||'{}')}catch(e){return {}}}
function syncSave(o){try{localStorage.setItem('foren_lsync',JSON.stringify(o))}catch(e){}}
function sTimes(id){const t=syncGet()[id]||[];return songLines(id).map((_,i)=>typeof t[i]==='number'?t[i]:null);}
function fmtT(t){return t===null?'--':(Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0'));}
function syncPaint(id){const t=sTimes(id);t.forEach((v,i)=>{const e=document.getElementById('st_'+id+'_'+i);if(e)e.textContent=fmtT(v)});}
function syncStore(id,t){const o=syncGet();o[id]=t;syncSave(o);syncPaint(id);}
function syncTap(id){const a=document.getElementById('a_'+id);const t=sTimes(id);const i=t.findIndex(v=>v===null);if(i<0)return;t[i]=Math.round(a.currentTime*10)/10;syncStore(id,t);syncMsg(id,'Line '+(i+1)+' set at '+fmtT(t[i])+(i+1<t.length?'. Next: line '+(i+2):'. All set!'));}
function syncNudge(id,i,d){const t=sTimes(id);if(t[i]===null)return;t[i]=Math.max(0,Math.round((t[i]+d)*10)/10);syncStore(id,t);const a=document.getElementById('a_'+id);if(a){a.currentTime=t[i];a.play()}}
function syncSetNow(id,i){const a=document.getElementById('a_'+id);const t=sTimes(id);t[i]=Math.round(a.currentTime*10)/10;syncStore(id,t);}
function syncGo(id,i){const t=sTimes(id)[i];if(t===null)return;const a=document.getElementById('a_'+id);a.currentTime=t;a.play();}
function syncClearLine(id,i){const t=sTimes(id);t[i]=null;syncStore(id,t);}
function syncUndo(id){const t=sTimes(id);let i=t.findIndex(v=>v===null);i=i<0?t.length-1:i-1;if(i<0)return;t[i]=null;syncStore(id,t);syncMsg(id,'Cleared line '+(i+1)+'. Next to tap: line '+(i+1));}
window._clr={};function syncClear(id){const b=document.getElementById('clr_'+id);if(!window._clr[id]){window._clr[id]=1;if(b)b.textContent='Tap again to clear all';syncMsg(id,'Tap Clear all again to erase every timing');setTimeout(()=>{window._clr[id]=0;const bb=document.getElementById('clr_'+id);if(bb)bb.textContent='Clear all'},4000);return}window._clr[id]=0;if(b)b.textContent='Clear all';syncStore(id,[]);syncMsg(id,'All timings cleared. Next to tap: line 1');}
function syncExport(id){const j=JSON.stringify(sTimes(id));try{navigator.clipboard.writeText(j)}catch(e){}prompt('Timings (copied if allowed). Save this text:',j);}
function syncImport(id){const j=prompt('Paste timings:');if(!j)return;try{const t=JSON.parse(j);if(!Array.isArray(t))throw 0;syncStore(id,t);syncMsg(id,'Imported')}catch(e){alert('Could not read that text')}}
function syncMsg(id,m){const e=document.getElementById('sm_'+id);if(e)e.textContent=m;}
function scrollIn(e){const bx=e.closest('.lyrbox');if(!bx)return;bx.scrollTo({top:e.offsetTop-bx.clientHeight/2+e.clientHeight/2,behavior:'smooth'});}
function curLine(t,ct){let cur=-1;t.forEach((v,i)=>{if(v!==null&&v<=ct+0.05&&(cur<0||v>=t[cur]))cur=i});return cur;}
function syncTick(id){const a=document.getElementById('a_'+id);if(!a)return;const t=sTimes(id);const cur=curLine(t,a.currentTime);const key='_cur_'+id;if(window[key]===cur)return;window[key]=cur;t.forEach((_,i)=>{const e=document.getElementById('sc_'+id+'_'+i);if(e)e.style.background=i===cur?'var(--accbg)':''});const e=document.getElementById('sc_'+id+'_'+cur);if(e&&!a.paused)scrollIn(e);}
function songCard(s){const L=songLines(s.id),t=sTimes(s.id);let last='';
 return `<div class="card"><h3>&#127925; ${s.title}</h3><audio id="a_${s.id}" data-song="1" onplay="setRate(rateGet())" onloadedmetadata="setRate(rateGet())" controls preload="none" style="width:100%" src="${s.file}" ontimeupdate="syncTick('${s.id}')" onseeked="syncTick('${s.id}')"></audio>
 ${rateBar()}<p class="small">File: ${s.file}. If the player is silent, keep trainer.html and the songs folder together.</p>
 <div class="tip"><b>Sync line by line:</b> press play. When each line starts, tap <b>TAP</b>. It marks the next line in order. Fix any line with -0.1 / +0.1, or press <b>Set now</b> on a line to stamp it at the current time.</div>
 <div class="row" style="position:sticky;top:0;z-index:5;background:var(--card);padding:6px 0"><button class="btn" style="font-size:18px;padding:14px 28px" onclick="syncTap('${s.id}')">TAP</button><button class="ghost" onclick="syncUndo('${s.id}')">Undo last</button><button class="ghost" id="clr_${s.id}" onclick="syncClear('${s.id}')">Clear all</button><button class="ghost" onclick="syncExport('${s.id}')">Export</button><button class="ghost" onclick="syncImport('${s.id}')">Import</button></div>
 <div class="small" id="sm_${s.id}">Next to tap: line ${(t.findIndex(v=>v===null)+1)||'none (all set)'}</div>
 <div class="lyrbox">${L.map((x,i)=>{let h='';if(x.tag!==last){last=x.tag;h=`<div class="small" style="margin-top:10px;color:var(--acc);font-weight:700">${x.tag}</div>`}return h+`<div id="sc_${s.id}_${i}" style="border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin:4px 0"><div class="row" style="margin:0"><span style="flex:1 1 200px">${i+1}. ${x.ln}</span><span class="small" id="st_${s.id}_${i}">${fmtT(t[i])}</span><button class="ghost" onclick="syncNudge('${s.id}',${i},-0.1)">-0.1</button><button class="ghost" onclick="syncNudge('${s.id}',${i},0.1)">+0.1</button><button class="ghost" onclick="syncSetNow('${s.id}',${i})">Set now</button><button class="ghost" onclick="syncGo('${s.id}',${i})">Play</button><button class="ghost" onclick="syncClearLine('${s.id}',${i})">x</button></div>${x.note?`<div class="small">${x.note}</div>`:''}</div>`}).join('')}</div></div>`;}
function songs(){const c=chkGet();const n=CHK.filter((_,i)=>c[i]).length;
 return SONGS.map(songCard).join('')+`<div class="card"><h3>My checklist <span class="pill" id="chkn">${n}/${CHK.length}</span></h3>${CHK.map((t,i)=>`<label style="display:block;margin:6px 0"><input type="checkbox" ${c[i]?'checked':''} onchange="chkSet(${i},this.checked)"> ${t}</label>`).join('')}</div>`;}

 {id:'f12',t:'Developing prints',p:'Which method for which surface?',a:'Paper is like a sponge, so ninhydrin soaks in and turns amino acids purple. A plastic cup is smooth, so super glue fumes build a white print on top. Dusting is like flour on a greasy hand. Iodine fuming leaves a brown print that fades like a bruise.',s:'Paper: ninhydrin. Plastic or metal: super glue. Quick and brown: iodine.',n:'Cyanoacrylate = super glue. Ninhydrin color = Ruhemann’s purple.'},

function jget(k,d){try{return JSON.parse(localStorage.getItem(k)||'')||d}catch(e){return d}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dayN(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function planGet(){const p=jget('foren_plan',null)||{start:today(),days:14,min:15};if(!jget('foren_plan',null))jset('foren_plan',p);p.min=Math.min(15,p.min||15);return p;}

function feelLog(id,ok,secs){const t=today();const dy=jget('foren_feel_days',{});const a=dy[id]||[];if(!a.includes(t))a.push(t);dy[id]=a;jset('foren_feel_days',dy);

 const h=jget('foren_feel_hist',{});const c=stageCounts();h[t]={s:c.s,l:c.l};jset('foren_feel_hist',h);if(!ok){const ms=jget('foren_feel_miss',{});ms[id]=(ms[id]||0)+1;jset('foren_feel_miss',ms)}const nn=jget('foren_feel_n',{});nn[t]=(nn[t]||0)+1;jset('foren_feel_n',nn);const bb=feelBox();if(ok&&(bb[id]||0)>=4&&(dy[id]||[]).length>=2){const lk=jget('foren_feel_lock',{});if(!lk[id]){lk[id]=t;jset('foren_feel_lock',lk)}}}
function planSet(k,v){const p=planGet();p[k]=k==='start'?v:Math.max(1,parseInt(v)||1);if(k==='min')p.min=Math.min(15,p.min);jset('foren_plan',p);planPaint();}
function planPaint(){const e=document.getElementById('feelPlan');if(!e)return;const p=planGet(),c=stageCounts(),tm=jget('foren_feel_time',{}),h=jget('foren_feel_hist',{});
 const left=Math.max(1,p.days-dayN(p.start,today())),elapsed=Math.max(0,dayN(p.start,today()));const need=FEEL.length-c.l;
 const rawRec=Math.max(10,Math.round(need*4*0.75/left/5)*5),rec=Math.min(15,rawRec),todayMin=Math.round((tm[today()]||0)/6)/10;const pct=Math.min(100,Math.round(100*todayMin/p.min));
 const W=640,H=180,L=34,B=22,T=10,R=8,pw=W-L-R,ph=H-T-B,N=FEEL.length;const X=i=>L+pw*i/Math.max(1,p.days-1),Y=v=>T+ph*(1-v/N);
 const pts=k=>{let last=0,out=[];for(let i=0;i<p.days;i++){const d=new Date(p.start+'T00:00:00');d.setDate(d.getDate()+i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(key>today())break;if(h[key])last=h[key][k];out.push(X(i)+','+Y(last))}return out.join(' ')};

 const xl=[0,Math.floor(p.days/2),p.days-1].map(i=>`<text x="${X(i)}" y="${H-6}" font-size="11" fill="var(--mut)" text-anchor="middle">Day ${i+1}</text>`).join('');

 e.innerHTML=`<h3>Memory progress &amp; daily plan</h3>

 <div class="small" style="margin-top:4px">Today: ${todayMin} of ${p.min} min</div><div class="bar" style="height:10px"><i style="width:${pct}%"></i></div></div>`;}

let feelCur=null,feelShow=false;
function feelBox(){try{return JSON.parse(localStorage.getItem('foren_feel')||'{}')}catch(e){return {}}}
function feelSave(o){try{localStorage.setItem('foren_feel',JSON.stringify(o))}catch(e){}}
function feelPick(lv){const b=feelBox();let pool=FEEL.filter(c=>lv==='C'||!c.c);const fs=document.getElementById('feelSet');if(!fs||fs.value==='top'){const t10=pool.filter(c=>TOP10.includes(c.id));if(t10.some(c=>(b[c.id]||0)<3))pool=t10}let tot=0;const w=pool.map(c=>{const x=6-Math.min(5,b[c.id]||0);tot+=x*x;return x*x});let r=Math.random()*tot,i=0;while(i<pool.length-1&&r>=w[i]){r-=w[i];i++}let c=pool[i];if(pool.length>1&&c.id===feelCur){c=pool[(i+1)%pool.length]}return c.id;}
function feelPaint(){const e=document.getElementById('feelDrill');if(!e)return;teamPaint();const c=FEEL.find(x=>x.id===feelCur);const b=feelBox();const done=FEEL.filter(x=>(b[x.id]||0)>=4).length;
 e.innerHTML=`<div class="small">Mastered ${done}/${FEEL.length} (4 right in a row). Missed cards come back more often.</div><h3>${c.e} ${c.t}${c.c?' <span class="pill cp">C</span>':''}</h3><div style="font-size:18px;margin:8px 0">${pl(c.p)}</div>`+
 (feelShow?`<div class="mem"><b>Picture it:</b> ${pl(c.a)}</div><div class="hook">${c.s}</div>${c.d?`<div class="try"><b>Try it (30 seconds):</b> ${c.d}</div>`:''}${c.n?`<div class="try"><b>With numbers:</b> ${pl(c.n)}</div>`:''}<div class="row"><button class="btn" onclick="feelGrade(1)">Got it</button><button class="ghost" onclick="feelGrade(0)">Missed it</button></div>`:`<div class="row"><button class="btn" onclick="feelShow=true;feelPaint();if(SPK.auto){const c=FEEL.find(x=>x.id===feelCur);speak(c.a+' '+c.s+' '+c.n)}">Show the picture</button><span class="small">Say the answer out loud first.</span></div>`);}

function spkText(el){const c=el.cloneNode(true);c.querySelectorAll('.spk,button,select,input,audio,svg,script,style').forEach(n=>n.remove());return c.textContent;}
function spkCard(btn){speak(spkText(btn.parentElement));}
function spkInject(){document.querySelectorAll('#view .card:not([data-spk])').forEach(c=>{c.setAttribute('data-spk','1');if(c.querySelector('audio')||c.id==='feelPlan')return;c.style.position='relative';const b=document.createElement('button');b.className='ghost spk';b.title='Read aloud';b.textContent='🔊';b.style.cssText='position:absolute;top:8px;right:8px;padding:2px 8px;font-size:15px';b.onclick=function(e){e.stopPropagation();e.preventDefault();spkCard(this)};c.appendChild(b);});}
(function(){const x=document.getElementById('xp');if(x)x.insertAdjacentHTML('afterend',`<div class="row small" style="margin:4px 0"><b>🔊 Read aloud:</b> speed <select id="spkRate" onchange="SPK.rate=parseFloat(this.value);localStorage.setItem('foren_rate',this.value)"><option value="0.75">slow</option><option value="0.95">normal</option><option value="1.2">fast</option></select><label><input type="checkbox" id="spkAuto" onchange="SPK.auto=this.checked;localStorage.setItem('foren_auto',this.checked?'1':'0')"> auto-read drill cards</label><button class="ghost" onclick="speechSynthesis.cancel()">Stop</button></div>`);const r=document.getElementById('spkRate');if(r){r.value=String(SPK.rate);if(!r.value)r.value='0.95'}const a=document.getElementById('spkAuto');if(a)a.checked=SPK.auto;
 const v=document.getElementById('view');if(v)new MutationObserver(spkInject).observe(v,{childList:true,subtree:true});if(window.speechSynthesis)speechSynthesis.getVoices();})();
// ---------- ACCOUNTS + PROGRESS SYNC (optional: needs config.js and a Supabase project) ----------
const SYNC_KEYS=['foren_stats','foren_log','foren_feel','foren_feel_days','foren_feel_time','foren_feel_hist','foren_feel_n','foren_feel_lock','foren_feel_miss','foren_plan','foren_today','foren_exps','foren_fday','foren_chk','foren_rate','foren_auto','foren_songrate'];
let SBC=null,SESSION=null,ROLE='local',NICK='',lastSnap='',lastShared='',loginCoach=false;
const EMAIL_DOMAIN='forensics.class';
function teachOk(){return ROLE==='coach'||(ROLE==='local'&&!cfgOk())}
function cfgOk(){return !!(window.FOREN_CFG&&FOREN_CFG.url&&FOREN_CFG.key&&!/YOUR_/.test(FOREN_CFG.url+FOREN_CFG.key)&&window.supabase)}
function snapData(){const d={};SYNC_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)d[k]=v});return d}
function applyData(d){SYNC_KEYS.forEach(k=>{if(d&&typeof d[k]==='string'){try{localStorage.setItem(k,d[k])}catch(e){}}})}
function loginUi(msg){let o=document.getElementById('loginBox');if(!o){o=document.createElement('div');o.id='loginBox';o.style.cssText='position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto';document.body.appendChild(o)}
 o.innerHTML=`<div class="card" style="max-width:380px;width:100%"><h1 style="font-size:22px">&#128269; Forensics C Trainer</h1><p class="small">${loginCoach?'Coach sign in':'Sign in with your nickname and the password your coach gave you.'}</p>
 <div style="display:grid;gap:8px"><input id="lgU" placeholder="${loginCoach?'Coach email':'Nickname'}" autocapitalize="none" autocomplete="username" style="width:100%"><input id="lgP" type="password" placeholder="Password" autocomplete="current-password" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn" onclick="doLogin()">Sign in</button></div>
 <div class="fb bad" id="lgErr" ${msg?'':'hidden'}>${msg||''}</div>
 <div class="row small" style="margin-top:10px"><button class="ghost" onclick="loginCoach=!loginCoach;loginUi()">${loginCoach?'Student sign in':'Coach sign in'}</button></div><p class="small">Ask your coach for your nickname and password.</p></div>`;}
function hideLogin(){const o=document.getElementById('loginBox');if(o)o.remove();}
function skipLogin(){ROLE='local';if(tab==='T'||tab==='P')tab='C';hideLogin();render();}
async function doLogin(){const u=document.getElementById('lgU').value.trim(),p=document.getElementById('lgP').value;if(!u||!p){loginUi('Enter both boxes.');return}
 const email=(loginCoach||u.includes('@'))?u:(u.toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@'+EMAIL_DOMAIN);
 const r=await SBC.auth.signInWithPassword({email,password:p});
 if(r.error||!r.data.session){loginUi('That nickname or password did not work. Ask your coach.');return}
 await onSession(r.data.session);}
async function signOut(){await pushProgress(true);try{await SBC.auth.signOut()}catch(e){}SESSION=null;ROLE='local';NICK='';location.reload();}
async function loadShared(){try{const r=await SBC.from('shared').select('data').eq('key','timings').maybeSingle();if(r.data&&r.data.data&&typeof r.data.data.v==='string'){localStorage.setItem('foren_lsync',r.data.data.v);lastShared=r.data.data.v}}catch(e){}}
async function pushShared(){try{const v=localStorage.getItem('foren_lsync')||'{}';if(v===lastShared)return;await SBC.from('shared').upsert({key:'timings',data:{v},updated_at:new Date().toISOString()});lastShared=v}catch(e){}}
async function pullProgress(){try{const r=await SBC.from('progress').select('data').eq('user_id',SESSION.user.id).maybeSingle();if(r.data&&r.data.data&&Object.keys(r.data.data).length){applyData(r.data.data)}else{await pushProgress(true)}}catch(e){}}
async function pushProgress(force){if(ROLE!=='student'||!SESSION)return;const d=snapData(),s=JSON.stringify(d);if(!force&&s===lastSnap)return;lastSnap=s;try{await SBC.from('progress').upsert({user_id:SESSION.user.id,nick:NICK,data:d,updated_at:new Date().toISOString()})}catch(e){lastSnap=''}}
async function onSession(s){SESSION=s;NICK=(s.user.email||'').split('@')[0];let coach=false;try{const c=await SBC.from('coaches').select('user_id').eq('user_id',s.user.id).maybeSingle();coach=!!(c.data)}catch(e){}
 ROLE=coach?'coach':'student';{const ow=localStorage.getItem('foren_owner');if(ow!==s.user.id){SYNC_KEYS.forEach(k=>localStorage.removeItem(k));try{localStorage.setItem('foren_owner',s.user.id)}catch(e){}}}await loadShared();if(ROLE==='student')await pullProgress();hideLogin();
 if(ROLE==='student'){lastSnap=JSON.stringify(snapData());setInterval(()=>pushProgress(false),15000);document.addEventListener('visibilitychange',()=>{if(document.hidden)pushProgress(false)})}
 else setInterval(pushShared,5000);
 const x=document.getElementById('spkRate');const bar=document.getElementById('acct');if(!bar){const b=document.createElement('div');b.id='acct';b.className='row small';b.style.margin='4px 0';b.innerHTML=`<span>Signed in as <b>${NICK}</b>${ROLE==='coach'?' (coach)':''}</span><button class="ghost" onclick="signOut()">Sign out</button>`;const xp=document.getElementById('xp');if(xp)xp.insertAdjacentElement('afterend',b)}
 if(!teachOk()&&tab==='T')tab='C';render();}
async function authInit(){if(!cfgOk()){ROLE='local';return}SBC=window.supabase.createClient(FOREN_CFG.url,FOREN_CFG.key);let s=null;try{const r=await SBC.auth.getSession();s=r.data.session}catch(e){}
 if(s)await onSession(s);else loginUi();}
// ----- add a student (coach only) -----
const PW_WORDS=['print','clue','case','swab','lens','trace','glass','blood','fiber','hair','dust','scene','spot','arch','loop','dna'];
function genPw(){const w=()=>PW_WORDS[Math.floor(Math.random()*PW_WORDS.length)];return w()+'-'+w()+'-'+(10+Math.floor(Math.random()*90));}
function addStuView(){return `<div class="tip"><b>Add a student.</b> Pick a nickname (no real names) and a password. Write both down: passwords cannot be looked up later.</div>
 <div class="card"><div style="display:grid;gap:8px;max-width:360px"><label class="small">Nickname (letters and numbers, 2 to 20 characters)<input id="asN" autocapitalize="none" style="width:100%"></label>
 <label class="small">Password (at least 6 characters)<input id="asP" style="width:100%"></label>
 <div class="row"><button class="ghost" onclick="document.getElementById('asP').value=genPw()">Make a password for me</button><button class="btn" onclick="addStudent()">Create student</button></div></div>
 <div id="asOut" style="margin-top:10px"></div></div>
 <div class="card"><h3>Your students</h3><div class="row"><button class="ghost" onclick="renderStuList()">Refresh</button><span class="small" id="stuListMsg"></span></div><div id="stuList" class="small" style="overflow-x:auto">Loading...</div></div>
 <div class="card"><h3>Other things you can do</h3><ul class="small"><li>Reset a password: Supabase &rarr; Authentication &rarr; Users.</li><li>See how they are doing: Students (progress) tab.</li></ul><div class="row"><a href="https://supabase.com/dashboard" target="_blank" rel="noopener">Open the Supabase Users page</a></div></div>`;}
function safeNick(s){return String(s).replace(/[^a-z0-9._-]/gi,'');}
async function renderStuList(){const box=document.getElementById('stuList');if(!box)return;if(!SBC||ROLE!=='coach'){box.textContent='Sign in as coach to see students.';return}
 box.textContent='Loading...';let r;try{r=await SBC.rpc('list_students')}catch(e){box.textContent='Could not load the list.';return}
 if(r.error){box.textContent='Could not load the list: '+String(r.error.message).replace(/[<>&]/g,'');return}
 const rows=r.data||[];if(!rows.length){box.textContent='No students yet.';return}
 box.innerHTML='<table><tr><th>Nickname</th><th>Created</th><th>Last sign in</th><th></th></tr>'+rows.map(x=>{const n=safeNick(x.nick);return `<tr><td><b>${n}</b></td><td>${new Date(x.created_at).toLocaleDateString()}</td><td>${x.last_sign_in?new Date(x.last_sign_in).toLocaleDateString():'never'}</td><td><button class="ghost" id="del_${n}" onclick="delStudent('${n}')">Delete</button></td></tr>`}).join('')+'</table>';}
window._delArm={};
async function delStudent(nick){const b=document.getElementById('del_'+nick),m=document.getElementById('stuListMsg');
 if(!window._delArm[nick]){window._delArm[nick]=1;if(b){b.textContent='Tap again to delete';b.style.borderColor='var(--bad)'}if(m)m.textContent='Deleting '+nick+' removes their login and all their progress.';setTimeout(()=>{window._delArm[nick]=0;const bb=document.getElementById('del_'+nick);if(bb){bb.textContent='Delete';bb.style.borderColor=''}},4000);return}
 window._delArm[nick]=0;if(m)m.textContent='Deleting...';let r;try{r=await SBC.rpc('delete_student',{p_nick:nick})}catch(e){if(m)m.textContent='Could not delete. Try again.';return}
 if(r.error){if(m)m.textContent='Could not delete: '+String(r.error.message).replace(/[<>&]/g,'');return}
 if(m)m.textContent=r.data?('Deleted '+nick+'.'):('No student named '+nick+' was found.');renderStuList();}
async function addStudent(){const out=document.getElementById('asOut');const nick=document.getElementById('asN').value.trim().toLowerCase(),pw=document.getElementById('asP').value;
 if(!/^[a-z0-9._-]{2,20}$/.test(nick)){out.innerHTML='<div class="fb bad">Nickname: use 2 to 20 letters, numbers, dot, dash or underscore. No spaces.</div>';return}
 if(pw.length<6){out.innerHTML='<div class="fb bad">Password needs at least 6 characters.</div>';return}
 if(!window.supabase||!FOREN_CFG){out.innerHTML='<div class="fb bad">Not connected to the database.</div>';return}
 out.innerHTML='<div class="small">Creating...</div>';
 const tmp=window.supabase.createClient(FOREN_CFG.url,FOREN_CFG.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 let r;try{r=await tmp.auth.signUp({email:nick+'@'+EMAIL_DOMAIN,password:pw})}catch(e){out.innerHTML='<div class="fb bad">Could not reach the database. Try again.</div>';return}
 if(r.error){const m=r.error.message||'';out.innerHTML=`<div class="fb bad">${/already|registered/i.test(m)?'That nickname is taken. Try another.':'Could not create: '+m.replace(/[<>&]/g,'')}</div>`;return}
 if(r.data&&r.data.user&&Array.isArray(r.data.user.identities)&&r.data.user.identities.length===0){out.innerHTML='<div class="fb bad">That nickname is taken. Try another.</div>';return}
 out.innerHTML=`<div class="fb ok"><b>Created.</b> Give this to the student:<br>Nickname: <b>${nick}</b><br>Password: <b>${pw.replace(/[<>&]/g,'')}</b><br><span class="small">Write it down now. It will not be shown again.</span></div>`;document.getElementById('asN').value='';document.getElementById('asP').value='';renderStuList();}
// ----- coach dashboard -----
function dayKeyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pj(d,k,dflt){try{return JSON.parse(d[k])||dflt}catch(e){return dflt}}
function studentStats(row){const d=row.data||{};const tm=pj(d,'foren_feel_time',{}),b=pj(d,'foren_feel',{}),dy=pj(d,'foren_feel_days',{}),ms=pj(d,'foren_feel_miss',{}),fd=pj(d,'foren_fday',{done:[]}),ex=pj(d,'foren_exps',{});
 let n=0,s=0,l=0;FEEL.forEach(c=>{const nd=(dy[c.id]||[]).length;if(!nd){n++;return}if((b[c.id]||0)>=4&&nd>=2)l++;else s++});
 const now=new Date();let streak=0;const x=new Date(now);if(!tm[dayKeyOf(x)])x.setDate(x.getDate()-1);while(tm[dayKeyOf(x)]){streak++;x.setDate(x.getDate()-1)}
 const todayMin=Math.round((tm[dayKeyOf(now)]||0)/6)/10;let weekMin=0;for(let i=0;i<7;i++){const y=new Date(now);y.setDate(y.getDate()-i);weekMin+=(tm[dayKeyOf(y)]||0)}weekMin=Math.round(weekMin/6)/10;
 const days=Object.keys(tm).sort();const dl=days.length?days[days.length-1]:null;const ul=row.updated_at?dayKeyOf(new Date(row.updated_at)):null;const last=(dl&&ul)?(dl>ul?dl:ul):(dl||ul);const since=last?dayN(last,dayKeyOf(now)):null;
 const weak=FEEL.map(c=>({t:c.t,m:ms[c.id]||0,streak:b[c.id]||0,seen:(dy[c.id]||[]).length})).filter(c=>c.m>=2&&c.streak<4).sort((a,c)=>c.m-a.m).slice(0,4);
 const flags=[];if(since===null)flags.push('Has not started');else if(since>=3)flags.push('Quiet for '+since+' days');if(since!==null&&weekMin<10)flags.push('Under 10 min this week');if(weak.length)flags.push('Keeps missing: '+weak.slice(0,3).map(w=>w.t).join(', '));
 const stt=pj(d,'foren_stats',{});let qr=0,qn=0;Object.keys(TOPICS).forEach(k=>{const z=stt['C'+k];if(z){qr+=z.r;qn+=z.n}});
 return {nick:row.nick,xp:stt.xp||0,acc:qn?Math.round(100*qr/qn):null,qn,n,s,l,streak,todayMin,weekMin,since,formulas:(fd.done||[]).length,exps:Object.values(ex).filter(Boolean).length,weak,flags,updated:row.updated_at};}
function studentsView(){return `<div class="tip"><b>Students.</b> Everyone who has signed in with a nickname shows here. Orange rows may need a quick chat.</div><div class="card"><div class="row"><button class="btn" onclick="renderStudents()">Refresh</button><span class="small" id="stuMsg"></span></div><div id="stuBox" class="small">Loading...</div></div>`;}
async function renderStudents(){const box=document.getElementById('stuBox'),msg=document.getElementById('stuMsg');if(!box)return;if(!SBC||ROLE!=='coach'){box.textContent='Sign in as coach to see students.';return}
 msg.textContent='Loading...';let r;try{r=await SBC.from('progress').select('nick,data,updated_at')}catch(e){box.textContent='Could not load.';return}if(r.error){box.textContent='Could not load: '+r.error.message;msg.textContent='';return}
 const st=(r.data||[]).map(studentStats).sort((a,c)=>(c.flags.length-a.flags.length)||a.nick.localeCompare(c.nick));msg.textContent=st.length+' student'+(st.length===1?'':'s');
 if(!st.length){box.innerHTML='No students have signed in yet.';return}
 box.innerHTML='<div style="overflow-x:auto"><table><tr><th>Nickname</th><th>Streak</th><th>Min today / week</th><th>Cards: long / short / new</th><th>Key facts</th><th>Activities</th><th>Quiz accuracy</th><th>Last active</th><th>Notes</th></tr>'+st.map(x=>`<tr style="${x.flags.length?'background:var(--accbg)':''}"><td><b>${x.nick.replace(/[<>&]/g,'')}</b></td><td>${x.streak}</td><td>${x.todayMin} / ${x.weekMin}</td><td>${x.l} / ${x.s} / ${x.n}</td><td>${x.formulas}</td><td>${x.exps}</td><td>${x.acc===null?'-':x.acc+'% ('+x.qn+')'}</td><td>${x.since===null?'never':x.since===0?'today':x.since+' d ago'}</td><td>${x.flags.length?x.flags.join('<br>'):'On track'}</td></tr>`).join('')+'</table></div>';}
// ----- class progress (every signed-in student can see everyone) -----
function rankName(x){let r=0;RANKS.forEach((a,i)=>{if(x>=a[0])r=i});return RANKS[r][1];}
function classView(){return `<div class="tip"><b>Class progress.</b> Everyone who is signed in can see how everyone else is doing. Only nicknames are shown. Cheer each other on and catch up if you are behind!</div><div class="card"><div class="row"><button class="btn" onclick="renderClass()">Refresh</button><span class="small" id="clsMsg"></span></div><div id="clsBox" class="small">Loading...</div></div>`;}
async function renderClass(){const box=document.getElementById('clsBox'),msg=document.getElementById('clsMsg');if(!box)return;if(!SBC||ROLE==='local'){box.textContent='Sign in to see your classmates.';return}
 msg.textContent='Loading...';if(ROLE==='student')await pushProgress(true);let r;try{r=await SBC.from('progress').select('nick,data,updated_at')}catch(e){box.textContent='Could not load.';msg.textContent='';return}
 if(r.error){box.textContent='Could not load: '+String(r.error.message).replace(/[<>&]/g,'');msg.textContent='';return}
 const st=(r.data||[]).map(studentStats).sort((a,c)=>(c.xp-a.xp)||a.nick.localeCompare(c.nick));msg.textContent=st.length+' student'+(st.length===1?'':'s');
 if(!st.length){box.innerHTML='Nobody has signed in yet.';return}
 const medal=['🥇','🥈','🥉'],N=FEEL.length;
 box.innerHTML='<div style="overflow-x:auto"><table><tr><th>#</th><th>Nickname</th><th>Rank</th><th>XP</th><th>Streak</th><th>Min this week</th><th>Cards locked in</th><th>Key facts</th><th>Activities</th><th>Quiz accuracy</th><th>Last active</th></tr>'+st.map((x,i)=>{const me=x.nick===NICK;const nk=x.nick.replace(/[<>&]/g,'');return `<tr style="${me?'background:var(--accbg);font-weight:700':''}"><td>${medal[i]||i+1}</td><td><b>${nk}</b>${me?' (you)':''}</td><td>${rankName(x.xp)}</td><td>${x.xp}</td><td>${x.streak}</td><td>${x.weekMin}</td><td>${x.l} of ${N}<div class="bar"><i style="width:${Math.round(100*x.l/N)}%"></i></div></td><td>${x.formulas} of ${FMLS.length}</td><td>${x.exps} of ${EXPS.length}</td><td>${x.acc===null?'-':x.acc+'% ('+x.qn+')'}</td><td>${x.since===null?'not yet':x.since===0?'today':x.since+' d ago'}</td></tr>`}).join('')+'</table></div><p class="small">XP comes from quizzes, games and drills. Cards locked in = 4 right in a row on 2 different days.</p>';}

render();
authInit();
</script></body></html>
